name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s test -t . -v
      - name: Run tests again in TZ=Asia/Jakarta (storage is UTC; hosts are not)
        env:
          TZ: Asia/Jakarta
        run: python -m unittest discover -s test -t .
      - name: Syntax check (entry point and package)
        run: python -m compileall -q -x 'test|deploy' bridge.py openbridge
