name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s test -t . -v
      - name: Syntax check (bridge entrypoint)
        run: python -m py_compile bridge.py store.py scheduler.py task_queue.py rate_limiter.py context_buffer.py usage_meter.py runtime_policy.py
